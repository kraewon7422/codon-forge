<!doctype html>
<!-- Codon Forge v1 (2026-11-03): gene-expression puzzle game, single file. Tests: open with ?test=1 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Codon Forge</title>
<meta name="description" content="A gene-expression puzzle game: transcribe, splice, cap and translate real human genes into proteins, base by base.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='18' width='8' height='10' rx='2' fill='%2341d17f'/%3E%3Crect x='12' y='18' width='8' height='10' rx='2' fill='%23ff6b6b'/%3E%3Crect x='21' y='18' width='8' height='10' rx='2' fill='%23ffd23f'/%3E%3Ccircle cx='16' cy='8' r='5' fill='%23ffab4a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #e9ecfb; --mute: #98a2c8; --faint: #5f6892;
    --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.14);
    --glass: rgba(18,24,50,.66); --glass2: rgba(28,36,72,.72);
    --A: #41d17f; --T: #ff6b6b; --U: #ff6b6b; --G: #ffd23f; --C: #5aa9ff;
    --np: #ffab4a; --po: #3fd6c6; --pos: #6f8cff; --neg: #ff6b8a; --sp: #9aa3bf;
    --ok: #7ef0b6; --bad: #ff7b8a; --star: #ffcc4d; --acc: #8ea2e6; --rf: #c792ff;
    --tw: 30px; --th: 38px; --gap: 2px; --cw: calc(3 * var(--tw) + 4 * var(--gap));
    --ease: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.34,1.56,.64,1);
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  @media (max-width: 560px) { :root { --tw: 26px; --th: 34px; } }
  @media (max-width: 380px) { :root { --tw: 23px; --th: 31px; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { background: #05070f; }
  body { min-height: 100vh; min-height: 100dvh; }
  body {
    color: var(--ink); font-family: Outfit, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background: radial-gradient(1100px 700px at 80% -10%, #1e2c63 0%, transparent 62%),
      radial-gradient(900px 640px at -8% 110%, #2b1642 0%, transparent 58%), linear-gradient(180deg, #0a0f23, #05070f);
    background-attachment: fixed; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: break-word;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- header ---------- */
  #bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px max(14px, env(safe-area-inset-right)) 10px max(14px, env(safe-area-inset-left));
    background: rgba(8,12,30,.72); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); min-height: 58px; }
  #bar .crumb { flex: 1; min-width: 0; line-height: 1.25; }
  #bar .crumb small { display: block; color: var(--mute); font-size: 12px; }
  #bar .crumb b { font-weight: 600; font-size: 16px; }
  .ib { height: 38px; min-width: 38px; padding: 0 12px; border-radius: 12px; background: var(--glass2); border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; white-space: nowrap; transition: background .2s, transform .15s var(--spring); }
  .ib:hover { background: rgba(48,60,112,.8); }
  .ib:active { transform: scale(.94); }
  .ib.on { background: rgba(255,204,77,.16); border-color: rgba(255,204,77,.4); }
  #langBtn .lk { opacity: .45; } #langBtn .lk.on { opacity: 1; } #langBtn .lsep { opacity: .4; }
  #bar .crumb b { overflow-wrap: normal; display: block; }
  @media (max-width: 420px) { #langBtn .lk:not(.on), #langBtn .lsep { display: none; } }
  #liveStars { color: var(--star); letter-spacing: 1px; font-size: 16px; white-space: nowrap; }
  #liveStars .off { color: var(--faint); }
  #miss { color: var(--mute); font-size: 13px; white-space: nowrap; }
  #miss b { color: var(--ink); }
  .brandmini { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 17px; }
  @media (max-width: 560px) { #hintBtn .lbl, #miss .lbl { display: none; } #miss b::before { content: '✗ '; color: var(--mute); font-weight: 400; } #bar { gap: 6px; padding-left: 10px; padding-right: 10px; } #bar .crumb small { display: none; } #bar .crumb b { font-size: 14px; } #bar .ib { padding: 0 9px; font-size: 13px; } #liveStars { font-size: 13px; letter-spacing: 0; } }

  main { max-width: 1060px; margin: 0 auto; padding: 18px max(14px, env(safe-area-inset-left)) 40px; }
  .panel { background: var(--glass); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.04); }

  /* ---------- home ---------- */
  .hero { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; padding: 26px 26px 22px; margin-bottom: 18px; }
  .hero h1 { margin: 0; font-size: clamp(30px, 6vw, 44px); letter-spacing: -.01em; }
  .hero p { margin: 6px 0 0; color: var(--mute); max-width: 560px; line-height: 1.5; }
  .hero .meta { display: flex; gap: 14px; margin-top: 14px; flex-wrap: wrap; font-size: 14px; color: var(--mute); }
  .hero .meta b { color: var(--ink); }
  .modes { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-bottom: 22px; }
  @media (max-width: 720px) { .modes { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  .mode { text-align: left; padding: 14px 16px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line); transition: transform .2s var(--ease), border-color .2s; }
  .mode:hover { transform: translateY(-2px); border-color: var(--line2); }
  .mode b { display: block; font-size: 15px; font-weight: 600; }
  .mode span { display: block; color: var(--mute); font-size: 13px; margin-top: 3px; line-height: 1.35; }
  .chap { padding: 18px 20px 16px; margin-bottom: 14px; }
  .chap header { display: flex; align-items: flex-start; gap: 12px; }
  .chap .num { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; background: rgba(142,162,230,.16); color: var(--acc); }
  .chap h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .chap header p { margin: 2px 0 0; color: var(--mute); font-size: 13px; }
  .chap header .grow { flex: 1; min-width: 0; }
  .chap .cardBtn { font-size: 13px; height: 32px; }
  .helix { position: relative; margin: 14px 0 4px; height: clamp(96px, 17vw, 150px); }
  .helix svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .node { position: absolute; transform: translate(-50%, -50%); width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
    background: #1b2450; border: 2px solid rgba(142,162,230,.5); font: 700 14px var(--mono); transition: transform .2s var(--spring), box-shadow .2s; }
  .node:hover { transform: translate(-50%, -50%) scale(1.08); box-shadow: 0 0 0 6px rgba(142,162,230,.12); }
  .node.done { border-color: var(--star); background: #2a2a3f; }
  .node.next { border-color: var(--ok); box-shadow: 0 0 0 6px rgba(126,240,182,.12); animation: breathe 2.4s ease-in-out infinite; }
  .node.lock { opacity: .4; cursor: not-allowed; }
  .node .st { position: absolute; top: 100%; margin-top: 2px; font: 11px Outfit, sans-serif; color: var(--star); letter-spacing: 1px; white-space: nowrap; }
  @keyframes breathe { 50% { box-shadow: 0 0 0 10px rgba(126,240,182,.06); } }
  .ltitles { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); text-align: center; font-size: 13px; color: var(--mute); margin-top: 14px; line-height: 1.3; }
  .ltitles span { padding: 0 4px; }
  @media (max-width: 480px) { .node { width: 44px; height: 44px; font-size: 12px; } .ltitles { font-size: 11.5px; } .ltitles span { padding: 0 2px; } }
  @media (max-width: 400px) { .ltitles { font-size: 10.5px; letter-spacing: -.02em; } }

  /* ---------- level ---------- */
  .brief { padding: 16px 18px; margin-bottom: 12px; }
  .brief .goal { font-size: 17px; font-weight: 600; line-height: 1.4; }
  .brief .learn { margin-top: 6px; color: #c8d0f0; font-size: 14px; line-height: 1.5; }
  .brief .src { margin-top: 8px; color: var(--faint); font-size: 12px; }
  .brief .dots { display: flex; gap: 6px; margin-top: 10px; }
  .brief .dots i { width: 22px; height: 5px; border-radius: 3px; background: var(--line2); transition: background .3s; }
  .brief .dots i.on { background: var(--acc); }
  .brief .dots i.done { background: var(--ok); }
  .stage { padding: 18px 16px; margin-bottom: 12px; position: relative; }
  .q { font-size: 15px; margin: 0 0 12px; color: #dfe4fb; line-height: 1.45; }
  .dock { padding: 14px 16px; }
  .fb { min-height: 48px; margin-top: 12px; padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.5; background: rgba(255,255,255,.03); border: 1px solid var(--line); color: var(--mute); transition: background .25s, border-color .25s, color .25s; }
  .fb:empty { visibility: hidden; }
  .fb.bad { background: rgba(255,123,138,.08); border-color: rgba(255,123,138,.3); color: #ffd3d9; }
  .fb.ok { background: rgba(126,240,182,.07); border-color: rgba(126,240,182,.28); color: #d4fbe6; }
  .fb.hint { background: rgba(255,204,77,.07); border-color: rgba(255,204,77,.3); color: #fff0c2; }
  .fb code, .mono { font-family: var(--mono); }

  /* ---------- sequences ---------- */
  .track { overflow-x: auto; overflow-y: hidden; padding: 6px 2px 12px; scrollbar-width: thin; scrollbar-color: #3a4580 transparent; -webkit-overflow-scrolling: touch; }
.wrapT { padding: 4px 2px 6px; }
  .wrapT .rows { display: block; }
  .wlab { font-size: 12px; color: var(--mute); margin-bottom: 8px; }
  .tiles.wrapflow { flex-wrap: wrap; row-gap: 20px; align-items: center; }
  .wrapflow .end { width: auto; padding: 0 5px; font: 700 13px var(--mono); color: var(--mute); }
  .b[data-n]::after { content: attr(data-n); position: absolute; top: calc(100% + 2px); left: 0; right: 0; text-align: center; font: 500 9.5px var(--mono); color: var(--faint); }
  .track > .rows { display: inline-flex; flex-direction: column; gap: 6px; min-width: 100%; }
  .strand { display: flex; align-items: center; gap: 6px; width: max-content; }
  .strand .lab { width: 64px; flex: none; font-size: 12px; color: var(--mute); text-align: right; line-height: 1.2; }
  .strand .end { flex: none; width: 22px; font: 700 13px var(--mono); color: var(--mute); text-align: center; }
  .tiles { display: flex; gap: var(--gap); }
  .b { position: relative; flex: none; width: var(--tw); height: var(--th); border-radius: 8px; display: grid; place-items: center; font: 700 15px var(--mono); color: #0b1024;
    transition: transform .25s var(--spring), opacity .3s, box-shadow .2s, background .2s; }
  .b i { position: absolute; top: 3px; left: 3px; width: 6px; height: 6px; background: rgba(0,0,0,.42); }
  .bA { background: var(--A); } .bA i { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .bT, .bU { background: var(--T); } .bT i, .bU i { border-radius: 50%; }
  .bG { background: var(--G); } .bG i { border-radius: 1px; }
  .bC { background: var(--C); } .bC i { transform: rotate(45deg) scale(.85); }
  .b.gap-, .b.bX { background: transparent; color: var(--faint); border: 1px dashed var(--line2); }
  .b.slot { background: rgba(255,255,255,.035); border: 1.5px dashed rgba(255,255,255,.2); color: transparent; }
  .b.cur { border-color: var(--ok); box-shadow: 0 0 0 3px rgba(126,240,182,.18); animation: pulse 1.4s ease-in-out infinite; }
  .b.pop { animation: pop .35s var(--spring); }
  .b.dim { opacity: .35; }
  .b.cs { margin-left: 6px; }
  .b.mark { box-shadow: 0 0 0 2px #fff, 0 0 14px rgba(255,255,255,.35); z-index: 1; }
  .b.glow { box-shadow: 0 0 0 2px var(--star), 0 0 16px rgba(255,204,77,.5); z-index: 1; }
  .b.warn { box-shadow: 0 0 0 2px var(--bad); }
  .b.intr { filter: saturate(.25) brightness(.62); }
  .b.diff { box-shadow: 0 0 0 2.5px #fff, 0 0 18px rgba(255,255,255,.5); z-index: 1; }
  .clickable .b { cursor: pointer; }
  .clickable .b:hover { transform: translateY(-3px); }
  .b.cutL::before, .b.cutR::before { content: ""; position: absolute; top: -8px; bottom: -8px; width: 3px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 10px #fff; }
  .b.cutL::before { left: calc(-1.5px - var(--gap) / 2); } .b.cutR::before { right: calc(-1.5px - var(--gap) / 2); }
  .b.hoverL::before, .b.hoverR::before { content: ""; position: absolute; top: -6px; bottom: -6px; width: 2px; background: rgba(255,255,255,.45); }
  .b.hoverL::before { left: calc(-1px - var(--gap) / 2); } .b.hoverR::before { right: calc(-1px - var(--gap) / 2); }
  .cap { flex: none; height: var(--th); padding: 0 9px; border-radius: 19px 8px 8px 19px; display: grid; place-items: center; font: 700 13px var(--mono); background: #e8e2ff; color: #2c1d6b; }
  .tail { display: flex; gap: var(--gap); }
  .ann { display: flex; gap: var(--gap); width: max-content; }
  .ann span { flex: none; width: var(--tw); text-align: center; font-size: 10px; color: var(--faint); font-family: var(--mono); }
  .ann span.cs { margin-left: 6px; }
  .ann .lbl { color: var(--star); font-size: 11px; font-family: Outfit, sans-serif; white-space: nowrap; overflow: visible; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(126,240,182,.08); } }
  @keyframes pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* palette */
  .pal { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .pal button { width: 64px; height: 64px; border-radius: 16px; font: 700 24px var(--mono); color: #0b1024; position: relative; transition: transform .15s var(--spring), filter .2s; }
  .pal button:active { transform: scale(.9); }
  .pal button:hover { filter: brightness(1.08); }
  .pal button i { position: absolute; top: 7px; left: 7px; width: 9px; height: 9px; background: rgba(0,0,0,.42); }
  .pal small { display: block; text-align: center; color: var(--faint); font-size: 12px; margin-top: 10px; }

  /* strand choice */
  .pickRow { display: block; width: 100%; text-align: left; border-radius: 14px; padding: 8px 6px; border: 1.5px solid transparent; transition: background .2s, border-color .2s; }
  .pickRow:hover { background: rgba(255,255,255,.04); border-color: var(--line2); }
  .pickRow.right { border-color: var(--ok); background: rgba(126,240,182,.06); }
  .pickRow.wrong { border-color: var(--bad); }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--mute); margin-left: 6px; vertical-align: 1px; }
  .tag.ok { background: rgba(126,240,182,.16); color: var(--ok); }

  /* choices */
  .opts { display: grid; gap: 8px; }
  .opt { text-align: left; padding: 13px 16px; border-radius: 14px; background: var(--glass2); border: 1px solid var(--line); font-size: 15px; line-height: 1.4; transition: background .2s, border-color .2s, transform .15s var(--spring); display: flex; gap: 10px; align-items: flex-start; }
  .opt:hover { border-color: var(--line2); background: rgba(48,60,112,.8); }
  .opt:active { transform: scale(.98); }
  .opt .k { flex: none; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; background: rgba(255,255,255,.08); color: var(--mute); margin-top: 1px; }
  .opt.right { border-color: var(--ok); background: rgba(126,240,182,.1); }
  .opt.wrong { border-color: var(--bad); background: rgba(255,123,138,.08); opacity: .6; }
  .opts.grid { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }

  /* sort */
  .sortCard { margin: 4px auto 18px; max-width: 460px; text-align: center; padding: 22px 18px; border-radius: 18px; background: rgba(255,255,255,.06); border: 1px solid var(--line2); font-size: 18px; line-height: 1.45; transition: transform .35s var(--ease), opacity .35s; }
  .sortCard.out { transform: translateY(-14px) scale(.96); opacity: 0; }
  .sortCard small { display: block; color: var(--faint); font-size: 12px; margin-bottom: 8px; }
  .bins { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
  .bin { border-radius: 14px; border: 1px solid var(--line); padding: 10px; min-height: 64px; background: rgba(255,255,255,.02); }
  .bin h4 { margin: 0 0 6px; font-size: 13px; color: var(--mute); font-weight: 600; }
  .bin p { margin: 0 0 5px; font-size: 12px; line-height: 1.35; color: #c8d0f0; animation: pop .3s var(--spring); }
  .bin p.miss { color: #ffc3cb; }
  .binBtns { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
  .binBtns .opt { justify-content: center; text-align: center; font-weight: 600; }
  @media (max-width: 480px) { .bins, .binBtns { gap: 6px; } .bin { padding: 8px 6px; } .bin p { font-size: 11px; letter-spacing: -.02em; } }

  /* ---------- translation ---------- */
  .tl { position: relative; height: 296px; overflow: hidden; touch-action: pan-y; }
  .ribo { position: absolute; top: 42px; left: 50%; width: calc(3 * var(--cw) + 34px); height: 236px; transform: translateX(-50%); transition: transform .9s var(--ease), opacity .9s; pointer-events: none; }
  .ribo .lsu { position: absolute; inset: 0 0 74px 0; border-radius: 46px 46px 22px 22px; background: radial-gradient(120% 90% at 50% 0%, rgba(150,120,255,.28), rgba(90,80,200,.16)); border: 1px solid rgba(180,160,255,.25); transition: transform .9s var(--ease); }
  .ribo .ssu { position: absolute; left: 14px; right: 14px; bottom: 0; height: 58px; border-radius: 16px 16px 30px 30px; background: linear-gradient(rgba(120,150,255,.18), rgba(110,130,255,.3)); border: 1px solid rgba(160,180,255,.25); transition: transform .9s var(--ease); }
  .ribo.split .lsu { transform: translateY(-40px); } .ribo.split .ssu { transform: translateY(40px); } .ribo.split { opacity: .35; }
  .site { position: absolute; top: 48px; width: var(--cw); height: 152px; margin-left: calc(var(--cw) / -2); border-radius: 14px; border: 1.5px dashed transparent; transition: border-color .3s, background .3s; }
  .site b { position: absolute; top: 4px; left: 8px; text-align: left; font-size: 13px; color: rgba(220,215,255,.7); font-weight: 700; letter-spacing: .1em; }
  .site.target { border-color: rgba(126,240,182,.6); background: rgba(126,240,182,.05); animation: pulse 1.6s ease-in-out infinite; }
  .site.drop { background: rgba(126,240,182,.14); }
  .mwin { position: absolute; left: 0; right: 0; top: 204px; height: calc(var(--th) + 22px); -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent); mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent); }
  .mrna { position: absolute; left: 0; top: 0; display: flex; align-items: flex-start; gap: var(--gap); transition: transform .55s var(--ease); will-change: transform; }
  .cod { flex: none; width: var(--cw); display: flex; justify-content: center; gap: var(--gap); position: relative; }
  .cod::after { content: attr(data-n); position: absolute; top: calc(var(--th) + 3px); left: 0; right: 0; text-align: center; font-size: 10px; color: var(--faint); font-family: var(--mono); }
  .cod.read::after { content: attr(data-aa); color: var(--mute); font-family: Outfit, sans-serif; font-size: 11px; }
  .cod.out .b { opacity: .3; }
  .mends { flex: none; font: 700 13px var(--mono); color: var(--mute); align-self: center; padding: 0 6px; }
  .trna { position: absolute; top: 46px; width: calc(var(--cw) - 8px); margin-left: calc((var(--cw) - 8px) / -2); height: 156px; transition: left .55s var(--ease), transform .55s var(--ease), opacity .45s; z-index: 2; }
  .trna svg { position: absolute; left: 50%; top: 22px; width: 54px; height: 104px; transform: translateX(-50%); }
  .trna .aab { position: absolute; left: 50%; top: -8px; transform: translateX(-50%); transition: opacity .3s, transform .35s var(--spring); }
  .trna .acod { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: var(--gap); }
  .trna .acod .b { height: calc(var(--th) - 8px); font-size: 13px; }
  .trna.rf .rfbody { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); width: 60px; height: 118px; border-radius: 22px 22px 14px 14px; background: linear-gradient(#d4b0ff, #9b6bff); display: grid; place-items: center; color: #1d0b44; font-weight: 700; font-size: 15px; }
  .trna.leave { opacity: 0; transform: translate(-24px, -46px) rotate(-12deg); }
  .bead { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 600 11px Outfit, sans-serif; color: #0b1024; flex: none; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
  .c-np { background: var(--np); } .c-po { background: var(--po); } .c-pos { background: var(--pos); } .c-neg { background: var(--neg); } .c-sp { background: var(--sp); }
  .pep { position: absolute; top: 4px; display: flex; align-items: center; gap: 0; transition: left .55s var(--ease), transform .8s var(--ease), opacity .8s; z-index: 3; transform: translateX(-100%); }
  .pep .bead { width: 30px; height: 30px; font-size: 10px; margin-left: -3px; animation: pop .35s var(--spring); }
  .pep .bead:first-child { margin-left: 0; }
  .pep .more { color: var(--faint); margin-right: 6px; font-size: 14px; }
  .pep.free { transform: translate(-100%, -40px); opacity: 0; }
  .floatTxt { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); font-size: 13px; font-weight: 600; color: var(--ok); white-space: nowrap; animation: floatUp 1.1s var(--ease) forwards; pointer-events: none; z-index: 5; }
  @keyframes floatUp { from { opacity: 0; transform: translate(-50%, 10px); } 20% { opacity: 1; } to { opacity: 0; transform: translate(-50%, -22px); } }
  .trayWrap { display: flex; gap: 12px; align-items: stretch; }
  .tray { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; padding: 4px 18px 10px 2px; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 26px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 26px), transparent); scrollbar-width: thin; scrollbar-color: #3a4580 transparent; }
  .tcard { flex: none; width: 96px; padding: 10px 6px 9px; border-radius: 14px; background: var(--glass2); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 7px; touch-action: none; transition: transform .18s var(--spring), border-color .2s, opacity .2s; user-select: none; }
  .tcard:hover { border-color: var(--line2); transform: translateY(-3px); }
  .tcard .acod { display: flex; gap: 2px; }
  .tcard .acod .b { width: 22px; height: 26px; font-size: 12px; border-radius: 6px; }
  .tcard .acod .b i { width: 5px; height: 5px; top: 2px; left: 2px; }
  .tcard small { font: 500 10.5px var(--mono); color: var(--mute); }
  .tcard .init { font-size: 10px; color: var(--ok); margin-top: -3px; }
  .tcard.rf { background: rgba(160,110,255,.16); border-color: rgba(199,146,255,.35); }
  .tcard .rfIcon { width: 34px; height: 34px; border-radius: 12px; background: linear-gradient(#d4b0ff, #9b6bff); display: grid; place-items: center; font-weight: 700; color: #1d0b44; font-size: 13px; }
  .tcard.used { opacity: .45; }
  .ghost { position: fixed; z-index: 60; pointer-events: none; transform: translate(-50%, -60%) scale(1.06) rotate(-3deg); opacity: .95; box-shadow: 0 16px 40px rgba(0,0,0,.45); }
  .big { height: auto; min-height: 56px; padding: 0 18px; border-radius: 16px; font-weight: 600; font-size: 15px; flex: none; background: linear-gradient(135deg, #4f63c9, #6b54d8); border: 0; }
  .big[disabled] { opacity: .35; cursor: default; filter: grayscale(.4); }
  .big.go { animation: breathe2 1.6s ease-in-out infinite; }
  @keyframes breathe2 { 50% { box-shadow: 0 0 0 7px rgba(142,162,230,.18); } }
  @media (max-width: 560px) { .tl { height: 290px; } .tcard { width: 84px; } .trayWrap { flex-direction: column; } .trayWrap .big { min-height: 48px; } }

  /* classify / edit */
  .cmpLab { font-size: 12px; color: var(--mute); }
  .protCmp { margin-top: 12px; font: 500 13px var(--mono); line-height: 1.9; }
  .protCmp .r { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .protCmp .r > span:first-child { font-family: Outfit, sans-serif; color: var(--mute); width: 72px; flex: none; }
  .protCmp em { font-style: normal; background: rgba(255,123,138,.25); border-radius: 3px; color: #ffd3d9; }
  .protCmp ins { text-decoration: none; background: rgba(126,240,182,.18); border-radius: 3px; }
  .pop { position: fixed; z-index: 50; padding: 8px; border-radius: 14px; background: #1c2550; border: 1px solid var(--line2); box-shadow: 0 16px 40px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 6px; animation: pop .2s var(--spring); }
  .pop .row { display: flex; gap: 6px; align-items: center; }
  .pop .row span { font-size: 11px; color: var(--mute); width: 34px; }
  .pop button.b { width: 34px; height: 36px; }
  .pop .del { height: 36px; padding: 0 10px; border-radius: 9px; background: rgba(255,123,138,.18); color: #ffd3d9; font-size: 13px; }
  .editBar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .editBar .cnt { font-size: 14px; color: var(--mute); }
  .editBar .cnt b { color: var(--ink); }

  /* ---------- modal / result ---------- */
  #modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(4,6,16,.62); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fade .25s; }
  #modal .box { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 22px; border-radius: 22px; background: #121a3c; border: 1px solid var(--line2); box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: rise .35s var(--ease); }
  #modal .box.wide { width: min(760px, 100%); }
  #modal h3 { margin: 0 0 4px; font-size: 20px; }
  #modal .sub { color: var(--mute); font-size: 13px; margin-bottom: 14px; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.98); } }
  .bigStars { font-size: 40px; letter-spacing: 6px; text-align: center; margin: 6px 0 4px; }
  .bigStars span { display: inline-block; color: var(--faint); }
  .bigStars span.on { color: var(--star); animation: starIn .55s var(--spring) both; text-shadow: 0 0 22px rgba(255,204,77,.5); }
  @keyframes starIn { from { transform: scale(0) rotate(-40deg); } }
  .criteria { display: grid; gap: 4px; font-size: 13px; color: var(--mute); margin: 8px 0 14px; }
  .criteria .y { color: var(--ink); }
  .beads { display: flex; flex-wrap: wrap; gap: 3px; margin: 8px 0; }
  .beads .bead { width: 26px; height: 26px; font-size: 9.5px; }
  .seqtxt { font: 500 12.5px/1.6 var(--mono); word-break: break-all; color: #cfd6f6; background: rgba(0,0,0,.2); border-radius: 10px; padding: 9px 11px; }

  .btns .ib { height: 42px; padding: 0 16px; }

  .unlock { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: rgba(126,240,182,.07); border: 1px solid rgba(126,240,182,.25); margin-top: 12px; text-align: left; width: 100%; }
  .unlock b { display: block; } .unlock span { font-size: 13px; color: var(--mute); }

  .concept li { margin-bottom: 6px; }
  .ctab { display: grid; grid-template-columns: 26px repeat(4, minmax(0,1fr)); gap: 3px; font: 500 11.5px var(--mono); }
  .ctab div { padding: 4px 3px; border-radius: 6px; background: rgba(255,255,255,.04); line-height: 1.5; }
  .ctab .h { background: none; color: var(--mute); text-align: center; font-weight: 700; display: grid; place-items: center; }
  .ctab span { display: block; white-space: nowrap; }
  .ctab span i { font-style: normal; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }

  /* ---------- codex / sandbox / time attack ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .pcard { text-align: left; padding: 16px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line); transition: transform .2s var(--ease), border-color .2s; min-height: 120px; }
  .pcard:hover { transform: translateY(-2px); border-color: var(--line2); }
  .pcard b { display: block; font-size: 16px; } .pcard small { color: var(--mute); font-size: 12px; }
  .pcard p { margin: 8px 0 0; font-size: 13px; color: #c8d0f0; line-height: 1.45; }
  .pcard.lock { opacity: .5; } .pcard.lock b { color: var(--faint); }
  .pcard .mini { display: flex; gap: 2px; margin-top: 10px; } .pcard .mini i { width: 8px; height: 8px; border-radius: 50%; }
  textarea, input[type=number], select { font: 500 13px var(--mono); color: var(--ink); background: rgba(0,0,0,.25); border: 1px solid var(--line2); border-radius: 12px; padding: 10px 12px; }
  textarea { width: 100%; min-height: 110px; resize: vertical; }
  .sbBar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .sbBar label { font-size: 13px; color: var(--mute); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; max-width: 100%; }
  .sbBar select { max-width: 100%; min-width: 0; }
  .sbBar input[type=number] { width: 78px; }
  .lanes { display: grid; gap: 6px; margin: 4px 0; }
  .lane { display: flex; align-items: center; gap: 8px; }
  .lane b { width: 26px; font: 600 12px var(--mono); color: var(--mute); }

  .lanes .orf:hover, .lanes .orf.sel { filter: brightness(1.2); box-shadow: 0 0 0 2px #fff; }
  .note { font-size: 13px; color: var(--mute); line-height: 1.5; }
  .ta { text-align: center; }
  .ta .codon { display: inline-flex; gap: 6px; margin: 10px 0 4px; }
  .ta .codon .b { width: 58px; height: 70px; font-size: 28px; border-radius: 14px; }
  .ta .codon .b i { width: 9px; height: 9px; top: 7px; left: 7px; }
  .timer { height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; margin: 6px 0 14px; }
  .timer i { display: block; height: 100%; background: linear-gradient(90deg, var(--ok), var(--star)); transform-origin: left; }
  .taOpts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; max-width: 560px; margin: 16px auto 0; }
  .taOpts .tcard { width: auto; padding: 14px 6px; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

// ---- Splicing (game rules = textbook consensus, simplified) ----
// 5' site: exon …AG|GURAGU… ; at least 3 of 5 flanking positions (−2 A, −1 G, +3 R, +4 A, +5 G) must match
// 3' site: AG with a polypyrimidine tract (≥ 8 of the 12 nt before AG are C/U)

// ---- Ribosome state machine: init → (elong ⇄ bonded) → done ----

// ---- Mutations ----
function diffRegion(a, b) {
  let p = 0; while (p < a.length && p < b.length && a[p] === b[p]) p++;
  let s = 0; while (s < a.length - p && s < b.length - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;

    for (const it of intr) if (touches(it.s, it.s + 2) || touches(it.e - 2, it.e)) return {type: 'splice', intron: it, d};
    refM = splice(ref, intr);

// ---- Six-frame ORF finder ----
function findORFs(dna, minAA = 30) {
  const d = toDNA(dna).replace(/[^ACGT]/g, ''), L = d.length, out = [];
  for (const strand of ['+', '-']) {
    const s = toRNA(strand === '+' ? d : revComp(d));
    for (let f = 0; f < 3; f++) {
      let st = -1;
      for (let i = f; i + 3 <= L; i += 3) {
        const c = s.substr(i, 3);
        if (st < 0 && c === 'AUG') st = i;
        else if (st >= 0 && isStop(c)) {
          const prot = translate(s, st);
          if (prot.length >= minAA) {
            const a = st, b = i + 3;

      q: L('주형 가닥을 돌려 3\'→5\'로 놓았어요. 전사하세요.', 'The template is turned to run 3\'→5\'. Transcribe it.'),
      hint: L('주형의 짝, U 사용.', 'Template partners, using U.')}]},
  // ===== 3 =====
  {id: '3-1', ch: 3, title: L('첫 인트론', 'First intron'),
    goal: L('인트론의 양 끝을 가위로 자르고, 가지점 A를 찾으세요.', 'Cut both ends of the intron, then find the branch-point A.'),
    learn: L('인트론은 GU로 시작해 AG로 끝나요.', 'An intron starts with GU and ends with AG.'),
    src: L('교육용 합성 pre-mRNA', 'Synthetic teaching pre-mRNA'),
    steps: [{t: 'cut', seq: SYN.i1, hint: L('5\' 자리는 GU 바로 앞, 3\' 자리는 AG 바로 뒤를 자르세요.', 'Cut just before the GU (5\' site) and just after the AG (3\' site).')},
    {t: 'branch', seq: SYN.i1, hint: L('C/U · U · 아무거나 · [A] · C/U 모양, 3\' 끝에서 18–40 nt 위.', 'Shape C/U · U · any · [A] · C/U, 18–40 nt above the 3\' end.')}]},
  {id: '3-2', ch: 3, title: L('가짜 신호', 'Decoys'),
    goal: L('GU와 AG가 여러 개예요. 진짜 경계만 자르세요.', 'There are several GUs and AGs. Cut only the real boundaries.'),
    learn: L('진짜 3\' 자리 앞에는 폴리피리미딘 띠와 18–40 nt 위의 가지점이 있어요. 5\' 자리는 AG|GURAGU를 닮아요.', 'A real 3\' site has a polypyrimidine tract and a branch point 18–40 nt upstream. A real 5\' site looks like AG|GURAGU.'),
    src: L('교육용 합성 pre-mRNA', 'Synthetic teaching pre-mRNA'),
    steps: [{t: 'cut', seq: SYN.i2, hint: L('C/U가 길게 이어진 띠 바로 뒤의 AG가 진짜예요.', 'The real AG comes right after a long run of C/U.')},
    {t: 'branch', seq: SYN.i2, hint: L('CUGAC 안의 A.', 'The A inside CUGAC.')}]},
  {id: '3-3', ch: 3, protein: 'HBB', title: L('진짜 인트론: HBB', 'A real intron: HBB'),
    goal: L('사람 β-글로빈 유전자의 인트론 1 (130 nt)을 잘라내세요.', 'Splice out intron 1 (130 nt) of the human β-globin gene.'),
    learn: L('실제 인트론은 길고, GU·AG가 안쪽에도 많아요. 규칙 전체를 봐야 해요.', 'Real introns are long, with many GUs and AGs inside. You need the whole rule.'),
    src: L('실제 서열: HBB 엑손 1 끝 · 인트론 1 (NC_000011.10) · 엑손 2 앞 (NM_000518.5)', 'Real sequence: end of HBB exon 1 · intron 1 (NC_000011.10) · start of exon 2 (NM_000518.5)'),
    steps: [{t: 'cut', seq: toRNA(HBB_GSEG()), hint: L('5\' 자리는 맨 앞 CAG|GUUGGU. 3\' 자리는 CCCACCCUUAG 뒤.', 'The 5\' site is CAG|GUUGGU near the start. The 3\' site follows CCCACCCUUAG.')},
    {t: 'branch', seq: toRNA(HBB_GSEG()), hint: L('3\' 끝에서 37 nt 위, CUGAC.', 'CUGAC, 37 nt above the 3\' end.')}]},
  {id: '3-4', ch: 3, title: L('캡과 꼬리', 'Cap and tail'),
    goal: L('5\' 캡을 고르고, 폴리 A 신호와 절단 자리를 찾으세요.', 'Choose the 5\' cap, then find the poly-A signal and the cut site.'),
    learn: L('캡과 꼬리는 mRNA를 분해에서 지키고 번역을 도와요.', 'The cap and tail protect the mRNA from decay and help translation.'),
    src: L('교육용 합성 3\' UTR', 'Synthetic teaching 3\' UTR'),
    steps: [{t: 'choice', q: L('mRNA 5\' 끝에 붙는 캡은?', 'Which cap goes on the 5\' end?'),
      opts: [L('7-메틸구아노신, 5\'–5\' 삼인산 결합', '7-methylguanosine, 5\'–5\' triphosphate link'), L('아데노신, 일반 3\'–5\' 결합', 'Adenosine, normal 3\'–5\' link'), L('7-메틸구아노신, 3\'–5\' 결합', '7-methylguanosine, 3\'–5\' link')], ans: 0,
      why: L('캡은 거꾸로 붙어요: 5\' 끝끼리 삼인산으로 연결돼요.', 'The cap is attached backwards: two 5\' ends joined by a triphosphate.'),

    {t: 'pick', seq: SYN.utr3, rna: true, key: 'signal', q: L('폴리 A 신호를 누르세요.', 'Tap the poly-A signal.'),

    {t: 'gap', seq: SYN.utr3, rna: true, key: 'cleave', q: L('자를 곳(염기 사이)을 누르세요.', 'Tap where the RNA is cut (between two bases).'),
      why: L('신호 끝에서 10–30 nt 뒤, CA 바로 다음을 잘라요.', 'Cut right after a CA, 10–30 nt past the end of the signal.'),
      hint: L('신호 뒤 범위 안에 CA는 하나뿐이에요.', 'There is only one CA in the window after the signal.')}]},
  // ===== 4 =====
  {id: '4-1', ch: 4, protein: 'UBB', title: L('첫 번역', 'First translation'),
    goal: L('개시 tRNA를 P 자리에 놓고, 코돈마다 맞는 tRNA를 A 자리로 넣은 뒤 전위하세요.', 'Put the initiator tRNA in the P site, then for each codon add the matching tRNA to A and translocate.'),
    learn: L('tRNA의 안티코돈(3\'→5\')이 코돈(5\'→3\')과 짝지어요.', 'The tRNA anticodon (3\'→5\') pairs with the codon (5\'→3\').'),
    src: L('실제 서열: 유비퀴틴 UBB (NM_018955.4) c.1–24', 'Real sequence: ubiquitin UBB (NM_018955.4) c.1–24'),
    steps: [{t: 'tl', m: toRNA(GENES.UBB.cds.slice(0, 30)), start: 0, end: 24, cap: true,

  {id: '4-2', ch: 4, protein: 'GFP', title: L('흔들리는 짝', 'Wobble'),
    goal: L('정확히 맞는 tRNA가 없는 코돈이 있어요. 워블 규칙으로 읽으세요.', 'Some codons have no exact tRNA. Read them with the wobble rule.'),
    learn: L('안티코돈 5\' 끝(표시된 오른쪽 끝) G는 코돈 3번째 U와도 짝지어요 (G·U).', 'The anticodon\'s 5\' base (shown at the right end) G can also pair with a codon\'s third-position U (G·U).'),
    src: L('실제 서열: GFP (M62653.1) 코돈 61–70 — 발색단 Ser65-Tyr66-Gly67', 'Real sequence: GFP (M62653.1) codons 61–70, chromophore Ser65-Tyr66-Gly67'),
    steps: [{t: 'tl', m: toRNA(SEG.GFP.seq), start: 0, end: 30, preload: true, first: 61,
      tray: [T('GGU'), T('GAA'), T('GGA'), T('GUA'), T('GCC'), T('GAC'), T('UUG'), T('GCA'), T('GUG'), T('GUC'), T('GGG')]}]},
  {id: '4-3', ch: 4, protein: 'COL1A1', title: L('이노신', 'Inosine'),
    goal: L('tRNA가 두 종류뿐인데 코돈은 여러 가지예요.', 'Only a couple of tRNAs, but several different codons.'),

    src: L('실제 서열: 콜라겐 COL1A1 (NM_000088.4) 코돈 142–151 — Gly-Pro-Pro 반복', 'Real sequence: collagen COL1A1 (NM_000088.4) codons 142–151, Gly-Pro-Pro repeats'),

      tray: [T('IGG'), T('ICC'), T('IGC'), T('ICG'), T('IGA')]}]},
  {id: '4-4', ch: 4, protein: 'INS', title: L('정지', 'Stop'),
    goal: L('인슐린 A 사슬의 끝을 만들고, 정지 코돈에서 사슬을 풀어주세요.', 'Build the end of insulin\'s A chain, then release it at the stop codon.'),

    src: L('실제 서열: 인슐린 INS (NM_000207.3) c.304–333 (마지막 코돈 + 정지)', 'Real sequence: insulin INS (NM_000207.3) c.304–333 (last codons + stop)'),
    steps: [{t: 'tl', m: toRNA(GENES.INS.cds.slice(-30)), start: 0, preload: true, first: 101,
      tray: [T('GUA'), T('CUG'), T('CAG'), T('CUC'), T('GUU'), T('GCA'), RF, T('GUC'), T('GUG'), T('CUU')]}]},
  // ===== 5 =====
  {id: '5-1', ch: 5, protein: 'INS', title: L('캡에서 출발', 'Start from the cap'),
    goal: L('리보솜이 캡에서 스캔해요. 번역이 시작될 AUG를 누르세요.', 'The ribosome scans from the cap. Tap the AUG where translation starts.'),
    learn: L('작은 소단위가 5\' 캡에서 3\' 쪽으로 미끄러지다 첫 좋은 AUG에서 멈춰요.', 'The small subunit slides from the 5\' cap toward 3\' and stops at the first good AUG.'),
    src: L('실제 서열: 인슐린 INS mRNA (NM_000207.3) 5\' UTR 59 nt + 시작', 'Real sequence: insulin INS mRNA (NM_000207.3) 5\' UTR 59 nt + start'),
    steps: [{t: 'pick', seq: toRNA(SEG.INS_UTR5 + GENES.INS.cds.slice(0, 18)), rna: true, cap: true, key: 'scan',
      q: L('시작 AUG의 아무 염기나 누르세요.', 'Tap any base of the start AUG.'), why: L('5\'부터 처음 나오는 AUG를 찾으세요. AUC·ACG는 아니에요.', 'Find the first AUG from the 5\' end. AUC and ACG don\'t count.'),
      hint: L('A-U-G 세 글자가 정확히 이어져야 해요.', 'It must be exactly A-U-G in a row.')},
    {t: 'choice', q: L('이 AUG의 Kozak 문맥: −3 = G, +4 = G. 세기는?', 'This AUG\'s Kozak context: −3 = G, +4 = G. How strong?'),
      opts: [L('강함', 'Strong'), L('적당함', 'Adequate'), L('약함', 'Weak')], ans: 0,
      why: L('−3 퓨린(A/G)과 +4 G가 둘 다 있으면 강해요.', 'A purine (A/G) at −3 and G at +4 together make it strong.'), hint: L('G는 퓨린이에요.', 'G is a purine.')}]},
  {id: '5-2', ch: 5, title: L('새는 스캐닝', 'Leaky scanning'),
    goal: L('AUG가 두 개예요. 리보솜이 실제로 시작하는 곳은?', 'There are two AUGs. Where does the ribosome actually start?'),
    learn: L('약한 문맥의 AUG는 리보솜이 대부분 지나쳐요.', 'Ribosomes mostly slide past an AUG in a weak context.'),
    src: L('교육용 합성 mRNA', 'Synthetic teaching mRNA'),
    steps: [{t: 'pick', seq: SYN.leaky, rna: true, cap: true, key: 'scan', kozak: true, q: L('시작 AUG를 누르세요.', 'Tap the start AUG.'),
      why: L('첫 AUG는 −3이 U, +4가 U라 약해요. 리보솜이 지나쳐요.', 'The first AUG has U at −3 and U at +4: weak. Ribosomes slide past it.'),
      hint: L('각 AUG의 −3과 +4를 비교하세요.', 'Compare −3 and +4 of each AUG.')},
    {t: 'choice', q: L('첫 AUG를 건너뛴 이유는?', 'Why was the first AUG skipped?'),
      opts: [L('−3에 퓨린, +4에 G가 없어서 (약한 문맥)', 'No purine at −3 and no G at +4 (weak context)'), L('AUG가 아니라서', 'It is not really an AUG'), L('5\' 캡에 너무 가까워서', 'It is too close to the cap')], ans: 0,
      why: L('둘 다 진짜 AUG예요. 차이는 주변 문맥이에요.', 'Both are real AUGs. The difference is the context.'), hint: L('Kozak.', 'Kozak.')}]},
  {id: '5-3', ch: 5, title: L('uORF', 'uORF'),
    goal: L('리보솜이 처음 개시하는 AUG를 누르세요.', 'Tap the AUG where the ribosome first starts.'),
    learn: L('uORF는 주 ORF 앞의 짧은 ORF예요. 사람 mRNA의 약 절반에 있어요.', 'A uORF is a short ORF before the main one. About half of human mRNAs have one.'),
    src: L('교육용 합성 mRNA', 'Synthetic teaching mRNA'),
    steps: [{t: 'pick', seq: SYN.uorf, rna: true, cap: true, key: 'scan', kozak: true, q: L('처음 쓰이는 AUG.', 'The first AUG used.'),
      why: L('앞쪽 AUG도 강한 문맥(CCACCAUGG)이에요. 리보솜은 거기서 먼저 시작해요.', 'The upstream AUG is also strong (CCACCAUGG). The ribosome starts there first.'),
      hint: L('5\'에 더 가까운 강한 AUG.', 'The strong AUG nearer the 5\' end.')},
    {t: 'choice', q: L('이 uORF(Met-Ala-정지)는 주 단백질에 어떤 영향을 줄까요?', 'What does this uORF (Met-Ala-stop) do to the main protein?'),
      opts: [L('리보솜을 먼저 써버려 주 단백질이 줄어든다', 'It uses up ribosomes first, so less main protein'), L('주 단백질 앞에 Met-Ala가 붙는다', 'Met-Ala is added to the front of the main protein'), L('아무 영향 없다', 'No effect')], ans: 0,
      why: L('uORF는 정지 코돈에서 끝나 따로 떨어져요. 다시 개시하는 리보솜은 일부뿐이에요.', 'The uORF ends at its own stop codon. Only some ribosomes start again downstream.'),
      hint: L('UGA에서 이미 끝났어요.', 'It already ended at UGA.')}]},
  {id: '5-4', ch: 5, title: L('uORF 없애기', 'Remove the uORF'),
    goal: L('염기 하나만 바꿔 리보솜이 주 ORF(Met-Glu-Ser-Phe)에서 바로 시작하게 하세요.', 'Change one base so the ribosome starts straight at the main ORF (Met-Glu-Ser-Phe).'),
    learn: L('uORF의 AUG를 깨는 돌연변이는 실제로 단백질 양을 늘리는 질환의 원인이 돼요.', 'Mutations that break a uORF\'s AUG really do cause disease by raising protein levels.'),
    src: L('교육용 합성 mRNA', 'Synthetic teaching mRNA'),
    steps: [{t: 'edit', seq: SYN.uorf, rna: true, cap: true, budget: 1, goal: 'scan', target: 'MESF', sol: [{op: 'sub', i: 10, b: 'C'}],
      hint: L('−3이나 +4만 바꾸면 "적당함"이라 여전히 시작해요. AUG 자체를 깨세요.', 'Changing only −3 or +4 leaves it "adequate", so it still starts. Break the AUG itself.')}]},
  // ===== 6 =====
  {id: '6-1', ch: 6, protein: 'HBB', title: L('겸상 적혈구', 'Sickle cell'),
    goal: L('정상과 환자의 HBB를 비교하고 돌연변이를 분류하세요.', 'Compare normal and patient HBB, then classify the mutation.'),
    learn: L('겸상 적혈구 빈혈: 산소가 적으면 적혈구가 낫 모양으로 찌그러져 혈관을 막아요. 원인은 HBB의 염기 단 하나.', 'Sickle-cell disease: with little oxygen the red cells bend into sickles and block vessels. The cause is a single HBB base.'),
    after: L('HbS = c.20A>T, GAG→GTG. 음전하 Glu 대신 소수성 Val이 들어가 헤모글로빈끼리 달라붙어요.', 'HbS = c.20A>T, GAG→GTG. Hydrophobic Val replaces charged Glu, so haemoglobin molecules stick together.'),
    src: L('실제 서열: HBB (NM_000518.5) c.1–27', 'Real sequence: HBB (NM_000518.5) c.1–27'),
    steps: [{t: 'classify', ref: GENES.HBB.cds.slice(0, 27), alt: sub(GENES.HBB.cds.slice(0, 27), 19, 'T'), first: 1, ans: 'missense-n',
      hint: L('길이는 같고 코돈 하나의 아미노산이 바뀌었어요. Glu(−)와 Val(소수성)은 성질이 같나요?', 'Same length, one codon\'s amino acid changes. Do Glu (−) and Val (hydrophobic) share properties?')},
    {t: 'choice', q: L('환자의 단백질은?', 'What is the patient\'s protein?'),
      opts: [L('Glu → Val 하나 바뀜 (성숙 단백질 번호로 Glu6Val)', 'One Glu → Val (Glu6Val in mature-protein numbering)'), L('7번에서 멈춘 짧은 단백질', 'A short protein stopping at 7'), L('7번부터 서열이 모두 바뀜', 'Every residue from 7 on changes')], ans: 0,
      why: L('치환 하나 → 아미노산 하나. 개시 Met은 잘려 나가서 7번 코돈이 "6번 Glu"예요.', 'One substitution → one amino acid. The first Met is removed, so codon 7 is "Glu6".'),
      hint: L('GUG는 Val.', 'GUG is Val.')}]},
  {id: '6-2', ch: 6, protein: 'CFTR', title: L('ΔF508', 'ΔF508'),
    goal: L('낭포성 섬유증의 가장 흔한 돌연변이를 분류하세요.', 'Classify the most common cystic-fibrosis mutation.'),
    learn: L('전 세계 낭포성 섬유증 유전자(대립유전자)의 약 70%가 이 돌연변이예요. 코돈 506–508을 잘 보세요.', 'About 70% of cystic-fibrosis alleles worldwide carry this mutation. Look closely at codons 506–508.'),
    after: L('c.1521_1523delCTT: 세 염기가 빠져 Phe508 하나만 사라져요. Ile507은 ATC→ATT로 그대로예요.', 'c.1521_1523delCTT: three bases go, so only Phe508 is lost. Ile507 stays (ATC→ATT).'),
    src: L('실제 서열: CFTR (NM_000492.4) c.1507–1536 (코돈 503–512)', 'Real sequence: CFTR (NM_000492.4) c.1507–1536 (codons 503–512)'),
    steps: [{t: 'classify', ref: SEG.CFTR.seq, alt: del(SEG.CFTR.seq, 14, 3), first: 503, ans: 'inframe',
      hint: L('빠진 염기 수가 3의 배수인가요?', 'Is the number of missing bases a multiple of 3?')},
    {t: 'choice', q: L('결과 단백질은?', 'What happens to the protein?'),
      opts: [L('Phe 하나만 빠지고 나머지는 그대로', 'One Phe is missing, the rest is unchanged'), L('508번부터 틀이 밀려 엉뚱한 서열', 'Frame shifts from 508: wrong sequence'), L('508번에서 멈춤', 'It stops at 508')], ans: 0,
      why: L('3염기 결실은 틀을 유지해요. 문제는 접힘이에요: ΔF508 단백질은 잘못 접혀 분해돼요.', 'A 3-base deletion keeps the frame. The problem is folding: ΔF508 protein misfolds and is destroyed.'),
      hint: L('코돈 하나 = 3 염기.', 'One codon = 3 bases.')}]},
  {id: '6-3', ch: 6, title: L('지중해빈혈', 'Thalassaemia'),
    goal: L('인트론 1 첫 염기의 G→A. 무엇이 고장 났을까요?', 'G→A at the first base of intron 1. What breaks?'),
    learn: L('β-지중해빈혈: β 사슬이 모자란 유전성 빈혈. 이 환자의 엑손 서열은 모두 정상이에요.', 'β-thalassaemia: an inherited anaemia with too little β chain. Every exon base in this patient is normal.'),

// ---- Step logic shared by the game and the tests ----
function buildTarget(st) {
  if (st.mode === 'comp') return complement(st.src, false);
  if (st.mode === 'revcomp') return revComp(st.src);
  return complement(st.src, true);           // transcribe: template shown 3'→5', mRNA 5'→3' below it
}
function pickAccept(st) {
  const s = st.seq;
  if (st.key === 'tata') { const t = tataBox(s); return [t, t + 5]; }
  if (st.key === 'tss') { const t = tssSite(s); return [t, t]; }
  if (st.key === 'signal') { const t = polyASignal(s); return [t, t + 5]; }
  if (st.key === 'scan') { const t = scanStart(s); return [t, t + 2]; }

const gapAccept = st => st.key === 'cleave' ? cleavageSites(st.seq) : [];
const cutTargets = st => findIntrons(st.seq).flatMap(i => [i.s, i.e]);
const branchAccept = st => findIntrons(st.seq).flatMap(i => i.bp);
function applyEdits(seq, ops) {
  let s = seq;
  for (const o of ops) s = o.op === 'sub' ? sub(s, o.i, o.b) : o.op === 'del' ? del(s, o.i) : s.slice(0, o.i) + o.b + s.slice(o.i);
  return s;
}
function editGoal(st, s) {
  if (st.goal === 'scan') { const i = scanStart(s); return i >= 0 && translate(s, i) === st.target ? {ok: true} : {ok: false, why: 'editScan', at: i}; }
  return translate(s) === st.target ? {ok: true} : {ok: false, why: 'editProt'};
}
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function tlNew(st) { return riboNew(st.m, st.start, {end: st.end, preload: st.preload}); }
// Plays a translation step with the tray, choosing the first item that fits each time.
function tlSolve(st) {
  const r = tlNew(st); let guard = 0;
  while (!r.done && guard++ < 500) {
    if (r.phase === 'bonded') { riboTranslocate(r); continue; }
    const it = st.tray.find(x => riboPlace(clone(r), x).ok);
    if (!it) return {ok: false, at: r.p, codon: riboCodon(r, riboTarget(r))};
    riboPlace(r, it);
  }
  return {ok: r.done, r};
}
// Plays every step of a level with correct inputs, through the same validators the game uses.
function solveLevel(lv) {
  for (const [k, st] of lv.steps.entries()) {
    const fail = m => ({ok: false, step: k, msg: m});
    switch (st.t) {
      case 'build': if (buildTarget(st).length !== st.src.length) return fail('target length'); break;
      case 'strand': if (!['top', 'bottom'].includes(st.ans)) return fail('ans'); break;
      case 'pick': { const [a, b] = pickAccept(st); if (a < 0 || b < a || b >= st.seq.length) return fail('no answer for ' + st.key); break; }
      case 'gap': if (gapAccept(st).length !== 1) return fail('gap answers: ' + gapAccept(st).length); break;
      case 'cut': if (cutTargets(st).length < 2) return fail('no intron'); break;
      case 'branch': if (!branchAccept(st).length) return fail('no branch'); break;
      case 'choice': if (!(st.ans >= 0 && st.ans < st.opts.length)) return fail('ans'); break;
      case 'sort': if (!st.cards.every(c => c.bin >= 0 && c.bin < st.bins.length)) return fail('bin'); break;
      case 'tl': { const s = tlSolve(st); if (!s.ok) return fail('stuck at ' + s.at + ' ' + s.codon); break; }
      case 'classify': { const c = classifyMutation(st.ref, st.alt, {genomic: st.genomic}).type; if (c !== st.ans) return fail('classified ' + c); break; }
      case 'edit': {
        if (st.sol.length > st.budget) return fail('over budget');
        if (editGoal(st, applyEdits(st.seq, st.sol)).ok !== true) return fail('solution fails');
        if (editGoal(st, st.seq).ok) return fail('already solved');
        break;
      }
      default: return fail('unknown step ' + st.t);
    }
  }
  return {ok: true};
}

}
function stepDone() {

}
function finishLevel() {
  if (!G) return;

  G.done = true;
  S.stars[lv.id] = Math.max(prev, stars);
  let fresh = null;
  if (lv.protein && !S.codex.includes(lv.protein)) { S.codex.push(lv.protein); fresh = lv.protein; }
  save(); sfx('win');
  const idx = LEVELS.indexOf(lv), nxt = LEVELS[idx + 1], chEnd = !nxt || nxt.ch !== lv.ch;
  const prot = G.product;
  openModal(`<h3 style="text-align:center">${t('cleared', {id: lv.id})}</h3><div class="sub" style="text-align:center">${tx(lv.title)}</div>
    <div class="bigStars">${[0, 1, 2].map(i => `<span class="${i < stars ? 'on' : ''}" style="animation-delay:${0.15 + i * 0.18}s">★</span>`).join('')}</div>
    <div class="criteria"><span class="y">✓ ${t('crit1')}</span><span class="${G.mistakes <= 1 ? 'y' : ''}">${G.mistakes <= 1 ? '✓' : '✗'} ${t('crit2', {n: G.mistakes})}</span><span class="${!G.hint ? 'y' : ''}">${!G.hint ? '✓' : '✗'} ${t('crit3')}</span></div>
    ${prot ? `<div class="note">${t('product')} (${prot.length} aa)</div>${beadsHTML(prot)}<div class="seqtxt">${prot}</div>
      <div class="note" style="margin-top:8px">${t('hp')}: <span class="mono">${toHP(prot)}</span></div>` : ''}
    ${fresh ? `<button class="unlock" id="unl">🧬<div><b>${t('newProt', {name: tx(PROTEINS[fresh].name)})}</b><span>${tx(PROTEINS[fresh].role)}</span></div></button>` : ''}
    ${chEnd ? `<button class="unlock" id="cc" style="background:rgba(142,162,230,.08);border-color:rgba(142,162,230,.3)">📘<div><b>${t('concept')}: ${tx(CHAPTERS[lv.ch - 1].title)}</b><span>${tx(CHAPTERS[lv.ch - 1].sub)}</span></div></button>` : ''}
    <div class="btns">${prot ? `<button class="ib" id="cpy">${t('copyHP')}</button>` : ''}<button class="ib" id="rt">${t('retry')}</button><button class="ib" id="mp">${t('map')}</button>${nxt ? `<button class="ib pri" id="nx">${t('next')}</button>` : ''}</div>`);
  const m = $('modal');
  m.onclick = null;
  $('rt').onclick = () => { closeModal(); startLevel(lv.id); };
  $('mp').onclick = () => go('#home');
  if ($('nx')) $('nx').onclick = () => go('#level/' + nxt.id);
  if ($('cpy')) $('cpy').onclick = e => { copyText(toHP(prot)); e.target.textContent = t('copied'); };
  if ($('unl')) $('unl').onclick = () => showProtein(fresh);

}

// =====================================================================================
// STEP TYPES
// =====================================================================================
const STEP = {};
const stage = () => $('stage'), dock = () => $('dock');

// ---- build a strand ----
STEP.build = {
  render(st) {
    const tgt = buildTarget(st), rna = st.mode === 'transcribe', n = st.src.length;
    const srcRow = st.mode === 'transcribe' ? strandHTML(t('template'), tilesHTML(st.src), "3'", "5'") : strandHTML(t('given'), tilesHTML(st.src), "5'", "3'");
    const slots = Array.from({length: n}, (_, i) => `<span class="b slot" data-i="${i}"><i></i></span>`).join('');
    const tgtRow = st.mode === 'comp' ? strandHTML(t('newS'), slots, "3'", "5'") : strandHTML(rna ? t('mrna') : t('newS'), slots, "5'", "3'");
    stage().innerHTML = (st.q ? `<p class="q">${tx(st.q)}</p>` : '') + `<div class="track"><div class="rows" id="srcRow">${srcRow}</div><div class="rows" id="tgtRow" style="margin-top:8px">${tgtRow}</div></div>`;
    const bases = rna ? ['A', 'U', 'G', 'C'] : ['A', 'T', 'G', 'C'];
    dock().innerHTML = `<div class="pal">${bases.map(b => `<button class="${BASE_CLS(b)}" data-b="${b}" aria-label="${b}"><i></i>${b}</button>`).join('')}</div><small style="display:block;text-align:center;color:var(--faint);font-size:12px;margin-top:10px">${lang === 'ko' ? '키보드' : 'Keyboard'}: ${bases.join(' ')}</small>`;
    dock().querySelectorAll('[data-b]').forEach(b => b.onclick = () => this.input(st, b.dataset.b));
    G.ctx = {i: 0, tgt};
    keyHandler = e => { const k = e.key.toUpperCase(); if ('ACGTU'.includes(k) && k.length === 1) { e.preventDefault(); this.input(st, k); } };
    this.mark(st);
  },
  mark(st) {
    const c = G.ctx, slots = [...$('tgtRow').querySelectorAll('.slot')];
    slots.forEach((s, i) => s.classList.toggle('cur', i === c.i));
    $('srcRow').querySelectorAll('.b').forEach(e => e.classList.remove('glow'));
    // the partner base glows; for the reverse complement it is the puzzle, so it only glows after a hint
    if (c.i < c.tgt.length && (c.hintOn || st.mode !== 'revcomp')) {
      const j = st.mode === 'revcomp' ? st.src.length - 1 - c.i : c.i;
      $('srcRow').querySelector(`[data-i="${j}"]`)?.classList.add('glow');
    }
    const cur = slots[c.i]; if (cur) { const tr = cur.closest('.track'); if (tr.scrollWidth > tr.clientWidth) scrollToTile(tr, c.i); }
  },
  hint(st) { G.ctx.hintOn = true; this.mark(st); },
  input(st, b) {
    const c = G.ctx; if (G.busy || c.i >= c.tgt.length) return;
    const rna = st.mode === 'transcribe', want = c.tgt[c.i];
    const slot = $('tgtRow').querySelector(`[data-i="${c.i}"]`);
    if (b === want) {
      slot.className = `b ${BASE_CLS(b)} pop`; slot.innerHTML = `<i></i>${b}`;
      c.i++; sfx('tick');
      if (c.i === c.tgt.length) { good(t('built')); G.product = null; this.mark(st); return stepDone(); }
      this.mark(st); if ($('fb').classList.contains('bad')) fb('');
      return;
    }
    if (rna && b === 'T') return mistake(t('rnaNoT'), slot);
    if (st.mode === 'revcomp') return mistake(t('wrongRev', {n: c.i + 1, a: st.src[st.src.length - 1 - c.i], b: want}), slot);
    mistake(t(rna ? 'wrongRNA' : 'wrongPair', {a: st.src[c.i], b: want}), slot);
  },
  auto(st) { while (G.ctx.i < G.ctx.tgt.length) this.input(st, G.ctx.tgt[G.ctx.i]); },
};

// ---- double strand: pick the template ----
function doubleHTML(top, labels = true, tags = {}) {
  return `<button class="pickRow" data-s="top">${strandHTML(labels ? t('top') + (tags.top || '') : '', tilesHTML(top), "5'", "3'")}</button>
    <button class="pickRow" data-s="bottom">${strandHTML(labels ? t('bottom') + (tags.bottom || '') : '', tilesHTML(complement(top)), "3'", "5'")}</button>`;
}
STEP.strand = {
  render(st) {
    const goal = st.geneOn ? '' : `<p class="q mono" style="font-size:13px;color:var(--mute)">${t('goalMrna', {s: toRNA(st.top.slice(0, 6))})}</p>`;
    stage().innerHTML = `<p class="q">${st.q ? tx(st.q) : t('pickTemplate')}</p>${goal}<div class="track"><div class="rows" id="dbl">${doubleHTML(st.top)}</div></div>`;
    dock().hidden = true;
    stage().querySelectorAll('[data-s]').forEach(b => b.onclick = () => this.input(st, b.dataset.s));
    keyHandler = e => { if (e.key === '1') this.input(st, 'top'); if (e.key === '2') this.input(st, 'bottom'); };
  },
  input(st, s) {
    if (G.busy) return;
    const row = stage().querySelector(`[data-s="${s}"]`);
    if (s !== st.ans) { row.classList.add('wrong'); later(() => row.classList.remove('wrong'), 900); return mistake(t('wrongStrand'), row); }
    row.classList.add('right');
    const other = stage().querySelector(`[data-s="${s === 'top' ? 'bottom' : 'top'}"]`);
    row.querySelector('.lab').innerHTML += `<span class="tag ok">${t('template')}</span>`;
    other.querySelector('.lab').innerHTML += `<span class="tag">${t('coding')}</span>`;

// ---- tap a base ----
function seqRowHTML(st, o = {}) {
  const rna = st.rna, capH = st.cap ? `<span class="cap" title="${t('capLab')}">m⁷G</span>` : '';
  return `<div class="wlab">${o.lab || (rna ? 'RNA' : 'DNA')} · ${st.seq.length} nt</div><div class="tiles wrapflow"><span class="end">5'</span>${capH}${tilesHTML(st.seq, {num: true, ...o})}<span class="end">3'</span></div>`;
}
function marksFor(seq) { G.marks = G.marks || {}; return (G.marks[seq] = G.marks[seq] || []); }
function applyMarks(root, seq) { for (const [a, b] of marksFor(seq)) for (let i = a; i <= b; i++) root.querySelector(`[data-i="${i}"]`)?.classList.add('glow'); }
STEP.pick = {
  render(st) {
    stage().innerHTML = `<p class="q">${tx(st.q)}</p><div class="wrapT clickable" id="trk"><div class="rows">${seqRowHTML(st)}</div></div>`;
    dock().hidden = true;
    const trk = $('trk');
    applyMarks(trk, st.seq);
    trk.querySelectorAll('.b[data-i]').forEach(e => e.onclick = () => this.input(st, +e.dataset.i));
  },
  input(st, i) {
    if (G.busy) return;
    const [a, b] = pickAccept(st), trk = $('trk'), el = trk.querySelector(`[data-i="${i}"]`);
    if (i >= a && i <= b) {
      marksFor(st.seq).push([a, b]); applyMarks(trk, st.seq);
      let msg = '';
      if (st.key === 'tata') msg = t('foundTata');
      else if (st.key === 'tss') msg = t('foundTss', {d: a - tataBox(st.seq)});
      else if (st.key === 'signal') msg = t('foundSignal');
      else if (st.key === 'scan') { const k = kozakScore(st.seq, a); msg = t('foundStart', {m3: st.seq[a - 3] || '–', p4: st.seq[a + 3] || '–', s: t(k.strength), n: k.score}); G.product = null; }
      good(msg); return stepDone();
    }
    let extra = '';
    if (st.key === 'scan') {
      const au = augs(st.seq).find(x => i >= x && i <= x + 2);
      if (au !== undefined) { const k = kozakScore(st.seq, au); extra = ' ' + t('kozakAt', {m3: st.seq[au - 3] || '–', p4: st.seq[au + 3] || '–', s: t(k.strength)}); }
    }
    if (st.key === 'tss') { const tb = tataBox(st.seq); if (tb >= 0 && i > tb) extra = ' ' + t('tssDist', {d: i - tb}); }
    mistake(tx(st.why) + extra, el);
  },
  auto(st) { this.input(st, pickAccept(st)[0]); },
};

// ---- tap between two bases ----
function gapFromEvent(el, e) { const r = el.getBoundingClientRect(), i = +el.dataset.i; return (e && e.clientX > r.left + r.width / 2) ? i + 1 : i; }
function bindGapHover(trk, onGap) {
  const clear = () => trk.querySelectorAll('.hoverL, .hoverR').forEach(x => x.classList.remove('hoverL', 'hoverR'));
  trk.querySelectorAll('.b[data-i]').forEach(el => {
    el.onpointermove = e => { if (e.pointerType !== 'mouse') return; clear(); const g = gapFromEvent(el, e); (g === +el.dataset.i ? el : el).classList.add(g === +el.dataset.i ? 'hoverL' : 'hoverR'); };
    el.onpointerleave = clear;
    el.onclick = e => { clear(); onGap(gapFromEvent(el, e)); };
  });
}
function markCut(trk, g) {
  trk.querySelector(`[data-i="${g}"]`)?.classList.add('cutL');
  if (!trk.querySelector(`[data-i="${g}"]`)) trk.querySelector(`[data-i="${g - 1}"]`)?.classList.add('cutR');
}
STEP.gap = {
  render(st) {
    stage().innerHTML = `<p class="q">${tx(st.q)}</p><div class="wrapT clickable" id="trk"><div class="rows">${seqRowHTML(st)}</div></div>`;
    dock().hidden = true;
    applyMarks($('trk'), st.seq);
    bindGapHover($('trk'), g => this.input(st, g));
  },
  input(st, g) {
    if (G.busy) return;
    const trk = $('trk'), acc = gapAccept(st);
    if (acc.includes(g)) {
      markCut(trk, g); good(t('cleaved'));
      for (let i = g; i < st.seq.length; i++) { const e = trk.querySelector(`[data-i="${i}"]`); later(() => e.classList.add('dim'), 120 + (i - g) * 15); }
      const tail = document.createElement('div'); tail.className = 'tail'; tail.style.marginLeft = '10px';
      trk.querySelector('.tiles').append(tail);
      for (let k = 0; k < 10; k++) later(() => { tail.insertAdjacentHTML('beforeend', tile('A', 'pop')); }, 300 + k * 70);
      later(() => tail.insertAdjacentHTML('beforeend', '<span class="mends">…</span>'), 1000);
      return stepDone();
    }
    const s = polyASignal(st.seq);
    mistake(tx(st.why) + (s >= 0 && g > s + 6 ? ' ' + t('gapInfo', {d: g - s - 6}) : ''), trk.querySelector(`[data-i="${Math.min(g, st.seq.length - 1)}"]`));
  },
  auto(st) { this.input(st, gapAccept(st)[0]); },
};

// ---- splicing ----
function intronCls(seq) { const iv = findIntrons(seq); return i => iv.some(x => i >= x.s && i < x.e) ? 'intr' : ''; }
STEP.cut = {
  render(st) {
    stage().innerHTML = `<p class="q">${lang === 'ko' ? '✂ 인트론 경계(염기 사이)를 누르세요. 위치는 염기의 왼쪽/오른쪽 절반으로 정해요.' : '✂ Tap the intron boundaries (between bases). Tap the left or right half of a base.'}</p>
      <div class="wrapT clickable" id="trk"><div class="rows">${seqRowHTML({...st, rna: true}, {lab: 'pre-mRNA'})}</div></div>`;
    dock().hidden = true;
    G.ctx = {done: new Set()};
    bindGapHover($('trk'), g => this.input(st, g));
  },
  hint(st) {
    const r = toRNA(st.seq), trk = $('trk');
    for (let i = 0; i + 1 < r.length; i++) if ((isGU(r, i) || isAGend(r, i + 2))) for (const k of [i, i + 1]) trk.querySelector(`[data-i="${k}"]`)?.classList.add('mark');
  },
  input(st, g) {
    if (G.busy) return;
    const trk = $('trk'), tg = cutTargets(st), c = G.ctx;
    if (c.done.has(g)) return;
    if (tg.includes(g)) {
      c.done.add(g); markCut(trk, g);
      if (c.done.size === tg.length) {
        const cls = intronCls(st.seq);
        trk.querySelectorAll('.b[data-i]').forEach(e => { if (cls(+e.dataset.i)) e.classList.add('intr'); });
        good(t('cutAll')); return stepDone();

      return good(t(tg.indexOf(g) % 2 === 0 ? 'cut5' : 'cut3'));
    }
    const w = cutWhy(st.seq, g), el = trk.querySelector(`[data-i="${Math.min(g, st.seq.length - 1)}"]`);
    if (w.k === 'cutAGpy') for (let k = g - 14; k < g - 2; k++) { const e = trk.querySelector(`[data-i="${k}"]`); if (e) { e.classList.add('warn'); later(() => e.classList.remove('warn'), 1500); } }
    mistake(t(w.k, {n: w.n}), el);
  },
  auto(st) { for (const g of cutTargets(st)) this.input(st, g); },
};
STEP.branch = {
  render(st) {

      <div class="wrapT clickable" id="trk"><div class="rows">${seqRowHTML({...st, rna: true}, {lab: 'pre-mRNA', cls})}</div></div>`;

    return /^[HP]+$/.test(hp) && hp.length === 110 && toHP('IVLFCMA') === 'HHHHHHH' && toHP('GPWYSTNQDEKRH') === 'PPPPPPPPPPPPP' || hp;
  });
  T_('23 time attack: every sense codon has a reader; each question has exactly one right answer', () => {
    if (ALL_CODONS.some(c => !isStop(c) && !readersOf(c).length)) return 'codon with no tRNA';
    const rnd = seeded('ta');
    for (let k = 0; k < 300; k++) { const q = taQuestion(rnd); if (q.opts.length !== 4 || q.opts.filter(a => wobblePairs(a, q.codon)).length !== 1) return JSON.stringify(q); }
    return true;
  });
  T_('24 codex: every level protein exists, every protein is unlockable, lengths match NCBI', () => {
    const keys = Object.keys(PROTEINS), used = new Set(LEVELS.map(l => l.protein).filter(Boolean));
    if (LEVELS.some(l => l.protein && !PROTEINS[l.protein])) return 'unknown protein';
    if (keys.some(k => !used.has(k))) return 'never unlocked: ' + keys.filter(k => !used.has(k));
    const bad = keys.filter(k => GENES[k] && GENES[k].prot.length !== PROTEINS[k].len); return !bad.length || 'len ' + bad;
  });
  // UI: play every level through the real input handlers
  const backup = serialize(S), wasLang = lang;
  FAST = true;
  for (const lg of ['ko', 'en']) {
    lang = lg;
    T_(`25 UI (${lg}): every level plays to a 3-star clear through the input handlers`, () => {
      S = SAVE_DEFAULT(); const bad = [];
      for (const lv of LEVELS) { const r = autoplayLevel(lv.id); closeModal(); if (r !== true) bad.push(lv.id + ': ' + r); }
      return !bad.length || bad.join(' | ');
    });
  }
  T_('26 UI: a wrong tRNA and a wrong base each cost one mistake with an explanation', () => {
    S = SAVE_DEFAULT(); startLevel('4-1'); flush();
    STEP.tl.place(T('GGC'), null); flush();                      // wrong: not initiator
    const m1 = G.mistakes, f1 = $('fb').textContent;
    startLevel('1-1'); flush(); STEP.build.input(G.lv.steps[0], 'ACGT'.replace(G.ctx.tgt[0], '')[0]); const m2 = G.mistakes, f2 = $('fb').textContent;
    return m1 === 1 && /Met-tRNAi/.test(f1.replace(/\u2060/g, '')) && m2 === 1 && f2.length > 5 || [m1, f1, m2, f2].join(' / ');
  });
  T_('27 UI: home, codex, sandbox and time attack render', () => {
    viewHome(); const n = document.querySelectorAll('.node').length;
    viewCodex(); const c = document.querySelectorAll('.pcard').length;
    viewSandbox(); const o = document.querySelectorAll('.orf').length;
    viewTA(); const ta = !!$('taGo');
    return n === 24 && c === 11 && o >= 1 && ta || [n, c, o, ta].join();
  });
  FAST = false; lang = wasLang; S = deserialize(backup); save(); G = null;
  location.hash = '#home'; route();

  const pass = res.filter(r => r[1]).length, el = $('tests');
  el.hidden = false;
  el.innerHTML = `<b>${t('tests')} ${pass}/${res.length}</b><br>` + res.map(([n, ok, m]) => `<span class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'}</span> ${esc(n)}${m ? ' — ' + esc(m) : ''}`).join('<br>');
  res.forEach(([n, ok, m]) => console[ok ? 'log' : 'error'](`${ok ? 'PASS' : 'FAIL'} ${n} ${m}`));
  document.title = `Tests ${pass}/${res.length}`;
}


// ---------- start ----------
document.documentElement.lang = lang;
route();
if (new URLSearchParams(location.search).has('test')) runTests();
window.CF = {LEVELS, startLevel, get G() { return G; }, STEP, route, autoplay: () => autoplayCurrent()};

</script>
